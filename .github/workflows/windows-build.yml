name: Windows x64 build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build FocusGlass Release x64
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process Bypass -Force
          .\build.ps1

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: FocusGlass-v1.0.0-windows-x64
          path: artifacts/x64/Release/FocusGlass.exe
          if-no-files-found: error
